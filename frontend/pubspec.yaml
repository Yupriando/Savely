name: frontend
description: "Savely - catat pemasukan, pengeluaran & wujudkan wishlist."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  audioplayers: ^6.7.1
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  file_saver: ^0.4.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
